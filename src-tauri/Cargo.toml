[package]
name = "bindsight"
version = "0.9.0"
description = "Star Citizen Joystick Binding Visualizer & Mapper"
authors = ["w00zla"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bindsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
quick-xml = "0.37"
uuid = { version = "1.26.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2"
log = "0.4"
os_info = { version = "3", default-features = false }

# SDL2 is linked differently per platform. On Windows we build it from source
# and static-link it, so the app needs no SDL2.dll and no system SDL2 install
# (requires CMake + a C toolchain at build time). Everywhere else we link the
# system SDL2 (see the SDL2-devel prerequisite), which stays the lean default.
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }
# GetKeyboardLayoutNameW for the default keyboard image-map (kblayout.rs).
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
sdl2 = "0.37"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
