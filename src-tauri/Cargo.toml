[package]
name = "bindsight"
version = "0.16.0"
description = "Star Citizen Binding Visualizer & Mapper"
authors = ["w00zla"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bindsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
quick-xml = "0.37"
uuid = { version = "1.26.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
# File dialogs via xdg-desktop-portal on Linux (the host's native dialog,
# right theme and icons; the plugin's default is rfd's own GTK3 dialog, which
# the AppImage's bundled GTK paints in forced Adwaita). Windows is unaffected.
tauri-plugin-dialog = { version = "2.7.3", default-features = false, features = ["xdg-portal"] }
tauri-plugin-log = "2"
log = "0.4"
os_info = { version = "3", default-features = false }
ttf-parser = "0.25.1"
fontdb = "0.24.0"
include_dir = "0.7"
# Data.p4k reading (see p4k.rs): CIG encrypts with AES-128-CBC, compresses with zstd.
aes = "0.8"
cbc = "0.1"
ruzstd = "0.8"
flate2 = "1"
tauri-plugin-updater = "2"
# GitHub API GET for a release's changelog (update.rs); rustls to match the
# updater's TLS stack, no native-tls pulled in.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Feed version vs. the running one, for installs without the updater (update.rs).
semver = "1"

# SDL2 is linked differently per platform. On Windows we build it from source
# and static-link it, so the app needs no SDL2.dll and no system SDL2 install
# (requires CMake + a C toolchain at build time). Everywhere else we link the
# system SDL2 (see the SDL2-devel prerequisite), which stays the lean default.
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }
# GetKeyboardLayoutNameW for the default keyboard image-map (kblayout.rs).
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_System_LibraryLoader"] }

[target.'cfg(not(windows))'.dependencies]
sdl2 = "0.37"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

