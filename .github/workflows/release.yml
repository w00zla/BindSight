# After a release is published (a draft made public, as a pre-release or a
# full one) or a pre-release is promoted to a full release:
# - the prerelease feed: the rolling `prerelease-version` release gets the
#   published release's latest.json, so the prerelease channel points at the
#   newest published version, pre-release or stable;
# - the README (full releases only): its release tags point at it.
# Only `v*` tags: the feed release itself is skipped.
name: Release published

on:
  release:
    types: [prereleased, released]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prerelease-feed:
    name: Prerelease feed
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Point prerelease-version at ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir feed
          if gh release view prerelease-version --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload prerelease-version feed/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create prerelease-version --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Prerelease feed" --notes "The prerelease channel's update feed: points at the newest published release, pre-release or stable. Not a download." \
              feed/latest.json
          fi
          echo "prerelease feed now points at $TAG"

  readme:
    name: README release links
    if: github.event.action == 'released' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Fill the release tags
        run: scripts/readme-updater.sh "${TAG#v}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "Point the README downloads at ${TAG}"
          git push origin main
