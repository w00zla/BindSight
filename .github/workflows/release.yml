# After a release is published (a draft made public, as a pre-release or a
# full one) or a pre-release is promoted to a full release:
# - the beta feed: the rolling `beta-version` release gets the published
#   release's latest.json, so the beta channel points at the newest
#   published version, beta or stable;
# - the README (full releases only): its release tags point at it.
# Manual `test-<sha>` builds and the feed release itself are skipped.
name: Release published

on:
  release:
    types: [prereleased, released]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  beta-feed:
    name: Beta feed
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - name: Point beta-version at ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir feed
          if gh release view beta-version --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload beta-version feed/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create beta-version --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Beta feed" --notes "The beta channel's update feed: points at the newest published release, beta or stable. Not a download." \
              feed/latest.json
          fi
          echo "beta feed now points at $TAG"

  readme:
    name: README release links
    if: github.event.action == 'released' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fill the release tags
        run: scripts/readme-updater.sh "${TAG#v}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "Point the README downloads at ${TAG}"
          git push origin main
