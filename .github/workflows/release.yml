# After a release is published (a draft made public, as a pre-release or a
# full one):
# - the channel (pre-releases with a channel tag `vx.y.z-<channel>.<n>`
#   only): channels.json on main points the channel at the tag, the entry
#   is created on the channel's first version. A tag older than the one listed
#   leaves it.
#   Removing a channel after its merge stays a manual step.
# - the legacy prerelease feed: the rolling `prerelease-version` release
#   gets the published release's latest.json. Only 0.16 and older read it
#   (their "Pre-Release" setting); drop the job once none is left. That
#   release exists once, made by hand (the Actions token may upload to it
#   but was refused creating it): gh release create prerelease-version
#   --prerelease --title "Prerelease feed" --notes "…" latest.json
# - the README (full releases only): its release tags point at it.
# Only `v*` tags: the feed release itself is skipped.
#
# Triggers: `published` for the channel and the feed — CI drafts a channel
# version already marked pre-release, and publishing such a draft fires
# `published` only, never `prereleased` — and `released` for the README (a
# full release fires both, so each job runs once). A manual run with a tag
# redoes the channel and the feed for a release already published.
name: Release published

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (vx.y.z or vx.y.z-<channel>.<n>)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prerelease-feed:
    name: Prerelease feed
    if: (github.event_name == 'workflow_dispatch' || github.event.action == 'published') && startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Point prerelease-version at ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! gh release view prerelease-version --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The prerelease-version feed release does not exist; create it once by hand (see the header of this workflow)." >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir feed
          gh release upload prerelease-version feed/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "prerelease feed now points at $TAG"

  channel:
    name: Channel
    if: (github.event_name == 'workflow_dispatch' || (github.event.action == 'published' && github.event.release.prerelease)) && startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point the channel at ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=${TAG#v}
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[a-z][a-z0-9-]{0,31}\.(0|[1-9][0-9]*)$'; then
            echo "$TAG is no channel tag (vx.y.z-<channel>.<n>); channels.json untouched"
            exit 0
          fi
          id=${version#*-}
          id=${id%.*}
          if [ "$id" = stable ]; then
            echo "'stable' is no channel id" >&2
            exit 1
          fi
          [ -f channels.json ] || printf '{\n  "channels": []\n}\n' > channels.json
          old=$(jq -r --arg id "$id" '.channels[] | select(.id == $id) | .tag' channels.json)
          if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "${old#v}" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "channel $id is at $old already, newer than $TAG; channels.json untouched"
            exit 0
          fi
          jq --indent 2 --arg id "$id" --arg tag "$TAG" '
            if any(.channels[]; .id == $id)
            then .channels |= map(if .id == $id then .tag = $tag else . end)
            else .channels += [{id: $id, tag: $tag}]
            end' channels.json > channels.json.new
          mv channels.json.new channels.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- channels.json && git ls-files --error-unmatch channels.json >/dev/null 2>&1; then
            echo "channels.json already up to date"
            exit 0
          fi
          git add channels.json
          git commit -m "Point the channel at ${TAG}"
          git push origin main

  readme:
    name: README release links
    if: github.event.action == 'released' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Fill the release tags
        run: scripts/readme-updater.sh "${TAG#v}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git add README.md
          git commit -m "Point the README downloads at ${TAG}"
          git push origin main
